services:
  scripta:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile.ultra-lite
    container_name: Scripta-Ultra-Lite
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../scripta/latest/config:/configs:rw
      - ../../scripta/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      ENDPOINTS_GROUPS_TO_REMOVE: "CLI"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Scripta-Ultra-lite
      UI_HOMEDESCRIPTION: Demo site for Scripta-Ultra-lite Latest
      UI_APPNAMENAVBAR: Scripta-Ultra-lite Latest
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    networks:
      - scripta-network

networks:
  scripta-network:
    driver: bridge

volumes:
  scripta-data:
  scripta-config:
  scripta-logs:
