[admin.settings.ai.general.test]
button = "Перевірити з’єднання"
failBody = "AI engine не відповів. Перевірте URL, чи запущено контейнер engine і чи увімкнено AI (після увімкнення потрібен перезапуск)."
failTitle = "AI engine недоступний"
okBody = "AI engine відповів на перевірку справності."
okTitle = "AI engine доступний"

[admin.settings.ai.general.timeoutSeconds]
