intro = "Окремий контейнер, який ви запускаєте поруч зі Scripta. Він виконує обґрунтування; Scripta і надалі самостійно виконує всі операції зі сторінками. Йому потрібен той самий"
outro = "в обох контейнерах і ключ постачальника моделей. Усе, що читає ШІ, надсилається вибраному вами постачальнику — Ollama, яку ви розміщуєте самі, зберігає кожну сторінку всередині вашої інфраструктури."
title = "Про AI engine"

