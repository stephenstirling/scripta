standard = "Eventos BASIC mais: início/encerramento de sessão do utilizador, alterações de conta, pedidos GET gerais. Exclui chamadas de sondagem contínua (/auth/me, /app-config, /health, etc.) para reduzir o ruído dos registos. Ideal para a maioria das implementações."
