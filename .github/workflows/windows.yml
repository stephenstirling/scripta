name: Windows build

# Builds Scripta for Windows on a Windows runner: the app jar, then a self-contained
# program with its own Java runtime (jpackage) as a portable zip and a per-user
# installer. The packaged program is launched and must answer on /api/v1/info/status
# before anything is uploaded. Pushing a v* tag also attaches both files to a GitHub
# release; the windows-exe branch and manual runs only produce downloadable artifacts.
#
# Tesseract (English, OSD and a few common languages), qpdf, Ghostscript, LibreOffice, WeasyPrint,
# ImageMagick and Poppler are bundled under tools/, each in its own folder (see BundledTools).
# THIRD-PARTY.txt in that folder lists their licences and where to get the source.
on:
  workflow_dispatch:
  push:
    branches: [windows-exe]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPTA_FLAVOR: core
  TASK_VERSION: "3.54.0"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          # Zulu ships the jmods that jlink needs to build a trimmed runtime; Temurin 25 does not.
          distribution: zulu
          java-version: "25"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The frontend build is driven through Task, which the Gradle build calls.
      - name: Install Task
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "task.zip"
          $dir = Join-Path $env:RUNNER_TEMP "task"
          Invoke-WebRequest "https://github.com/go-task/task/releases/download/v$env:TASK_VERSION/task_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the jar and the frontend
        shell: pwsh
        run: >
          ./gradlew.bat clean build
          -PbuildWithFrontend=true
          -PjpdfiumPlatforms=windows-x64
          -PbundleOnnxRuntime=true
          -x spotlessApply -x spotlessCheck -x test -x sonarqube
          --no-daemon

      - name: Package the program
        shell: pwsh
        run: |
          $jar = Get-ChildItem app/core/build/libs/*.jar | Where-Object { $_.Name -notmatch 'plain' } | Select-Object -First 1
          if (-not $jar) { throw "No application jar found in app/core/build/libs" }
          $version = (Select-String -Path build.gradle -Pattern "^\s*version = '([\d.]+)'" | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw "Could not read the version from build.gradle" }
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path dist-input | Out-Null
          Copy-Item $jar.FullName dist-input/scripta.jar
          # The restart helper must sit beside the main jar (JarPathUtil looks there).
          Copy-Item build/libs/restart-helper.jar dist-input/restart-helper.jar

          # Every runtime module except the JDK's own developer tools. A Spring Boot fat jar
          # hides its dependencies from jpackage's module detection, and a missing module only
          # shows up as a crash at runtime, so this trims by exclusion rather than by guessing.
          # If jlink fails, the whole JDK is used as the runtime: larger but complete.
          $devTools = "jdk.jshell","jdk.jdeps","jdk.javadoc","jdk.compiler","jdk.jcmd","jdk.jconsole","jdk.jlink","jdk.jpackage","jdk.hotspot.agent","jdk.jartool","jdk.jdi","jdk.editpad"
          $modules = ((java --list-modules) | ForEach-Object { ($_ -split '@')[0] } | Where-Object { $devTools -notcontains $_ }) -join ","
          jlink --module-path "$env:JAVA_HOME/jmods" --add-modules $modules --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output runtime
          if ($LASTEXITCODE -ne 0) {
            Write-Host "jlink failed; using the full JDK as the runtime"
            Remove-Item -Recurse -Force runtime -ErrorAction SilentlyContinue
            Copy-Item $env:JAVA_HOME runtime -Recurse
          }
          Write-Host "Runtime: $([math]::Round((Get-ChildItem runtime -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

          # Config, logs and pipelines default to the current folder; scripta.user-data moves
          # them to %LOCALAPPDATA%\Scripta so settings and sign-in tokens survive updates that
          # unpack each version into its own folder.
          jpackage --type app-image `
            --name Scripta `
            --app-version $version `
            --vendor "Stephen Stirling" `
            --description "Self-hosted PDF tools" `
            --input dist-input `
            --main-jar scripta.jar `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --runtime-image runtime `
            --java-options "-DBROWSER_OPEN=true" `
            --java-options "-Dscripta.user-data=true" `
            --java-options '-Dscripta.tools-path=$APPDIR/../tools' `
            --win-console `
            --dest packaged
          if ($LASTEXITCODE -ne 0) { throw "jpackage app-image failed" }

      # The launcher cannot extend PATH, so the app finds this copy through scripta.tools-path.
      - name: Bundle Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "tesseract.exe not found in $src" }
          $dest = "packaged/Scripta/tools/tesseract"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" $dest -Recurse -Force -Exclude "unins*","*.url"
          $tessdata = Join-Path $dest "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          foreach ($lang in "eng","osd","deu","fra","spa","ita","por","nld") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile (Join-Path $tessdata "$lang.traineddata")
          }
          & "$dest/tesseract.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled tesseract does not run" }
          & "$dest/tesseract.exe" --list-langs
          Write-Host "Bundled Tesseract: $([math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      # qpdf (Apache-2.0) backs Compress, Repair and PDF/A conversion.
      - name: Bundle qpdf
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipDir = Join-Path $env:RUNNER_TEMP "qpdf-download"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          gh release download --repo qpdf/qpdf --pattern "qpdf-*-msvc64.zip" --dir $zipDir
          if ($LASTEXITCODE -ne 0) { throw "could not download qpdf" }
          $zip = Get-ChildItem $zipDir -Filter "*.zip" | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP "qpdf-extract"
          Expand-Archive $zip.FullName -DestinationPath $extract
          $bin = Get-ChildItem $extract -Recurse -Filter "qpdf.exe" | Select-Object -First 1
          if (-not $bin) { throw "qpdf.exe not found in $($zip.Name)" }
          $dest = "packaged/Scripta/tools/qpdf"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$($bin.DirectoryName)\*" $dest -Recurse -Force
          $root = $bin.Directory.Parent.FullName
          Get-ChildItem $root -File | Where-Object { $_.Name -match "LICENSE|NOTICE|README" } | Copy-Item -Destination $dest
          Write-Host "Bundled $($zip.Name)"
          & "$dest/qpdf.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled qpdf does not run" }

      # Each program is fetched on its own and reported at the end, so one broken download
      # does not hide the others. Ghostscript (AGPL) and Poppler (GPL) are separate programs
      # shipped as-is; THIRD-PARTY.txt names their licences and where the source is.
      - name: Bundle Ghostscript, LibreOffice, WeasyPrint, ImageMagick and Poppler
        timeout-minutes: 40
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = (Resolve-Path "packaged/Scripta/tools").Path
          $work = Join-Path $env:RUNNER_TEMP "bundle"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $results = [ordered]@{}
          $notices = New-Object System.Collections.Generic.List[string]

          function Invoke-Bundle([string]$name, [scriptblock]$body) {
            try { & $body; $results[$name] = "ok" }
            catch { $results[$name] = "FAILED: $($_.Exception.Message)"; Write-Host "::error::$name failed: $($_.Exception.Message)" }
          }
          function Get-GitHubAsset([string]$repo, [string]$pattern, [string]$dir) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            gh release download --repo $repo --pattern $pattern --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "could not download $pattern from $repo" }
            $file = Get-ChildItem $dir -File | Select-Object -First 1
            if (-not $file) { throw "no file matching $pattern in $repo" }
            $file
          }

          Invoke-Bundle "Ghostscript" {
            $installer = Get-GitHubAsset "ArtifexSoftware/ghostpdl-downloads" "gs*w64.exe" (Join-Path $work "gs")
            # Unpacked rather than run: the silent installer never exits on a CI runner.
            $unpacked = Join-Path $work "gs-x"
            & $sevenZip x $installer.FullName "-o$unpacked" -y | Out-Null
            $console = Get-ChildItem $unpacked -Recurse -Filter "gswin64c.exe" | Select-Object -First 1
            if (-not $console) { throw "gswin64c.exe not found in $($installer.Name)" }
            $root = $console.Directory.Parent.FullName
            if (-not (Test-Path (Join-Path $root "lib"))) { throw "unexpected Ghostscript layout: no lib folder beside bin" }
            $dest = Join-Path $tools "gs"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$root\*" $dest -Recurse -Force
            # The app calls plain "gs".
            Copy-Item (Join-Path $dest "bin\gswin64c.exe") (Join-Path $dest "bin\gs.exe")
            & (Join-Path $dest "bin\gs.exe") -version
            if ($LASTEXITCODE -ne 0) { throw "bundled gs does not run" }
            $notices.Add("Ghostscript ($($installer.Name)) - GNU AGPL v3 - source: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases and https://ghostscript.com/releases/")
          }

          Invoke-Bundle "ImageMagick" {
            $index = (Invoke-WebRequest "https://imagemagick.org/archive/binaries/" -UseBasicParsing).Content
            $best = [regex]::Matches($index, 'ImageMagick-(\d+\.\d+\.\d+)-(\d+)-portable-Q16-HDRI-x64\.7z') |
              Sort-Object { [version]"$($_.Groups[1].Value).$($_.Groups[2].Value)" } -Descending | Select-Object -First 1
            if (-not $best) { throw "no portable x64 build listed" }
            $archive = Join-Path $work $best.Value
            Invoke-WebRequest "https://imagemagick.org/archive/binaries/$($best.Value)" -OutFile $archive
            $dest = Join-Path $tools "magick"
            & $sevenZip x $archive "-o$dest" -y | Out-Null
            if (-not (Test-Path (Join-Path $dest "magick.exe"))) { throw "magick.exe not found" }
            & (Join-Path $dest "magick.exe") -version | Select-Object -First 1
            $notices.Add("ImageMagick ($($best.Value)) - ImageMagick License (Apache-2.0 style) - source: https://imagemagick.org/script/download.php")
          }

          Invoke-Bundle "Poppler" {
            $zip = Get-GitHubAsset "oschwartz10612/poppler-windows" "Release-*.zip" (Join-Path $work "poppler")
            $extract = Join-Path $work "poppler-x"
            Expand-Archive $zip.FullName -DestinationPath $extract
            $exe = Get-ChildItem $extract -Recurse -Filter "pdftohtml.exe" | Select-Object -First 1
            if (-not $exe) { throw "pdftohtml.exe not found" }
            $dest = Join-Path $tools "pdftohtml"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$($exe.DirectoryName)\*" $dest -Recurse -Force
            $notices.Add("Poppler ($($zip.Name)) - GNU GPL v2/v3 - source: https://poppler.freedesktop.org/ and https://github.com/oschwartz10612/poppler-windows/releases")
          }

          Invoke-Bundle "WeasyPrint" {
            $asset = Get-GitHubAsset "Kozea/WeasyPrint" "*windows*" (Join-Path $work "weasyprint")
            $dest = Join-Path $tools "weasyprint"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            if ($asset.Extension -eq ".zip") {
              $extract = Join-Path $work "weasyprint-x"
              Expand-Archive $asset.FullName -DestinationPath $extract
              $exe = Get-ChildItem $extract -Recurse -Filter "weasyprint.exe" | Select-Object -First 1
              if (-not $exe) { throw "weasyprint.exe not found in $($asset.Name)" }
              Copy-Item "$($exe.DirectoryName)\*" $dest -Recurse -Force
            } else {
              Copy-Item $asset.FullName (Join-Path $dest "weasyprint.exe")
            }
            & (Join-Path $dest "weasyprint.exe") --version
            if ($LASTEXITCODE -ne 0) { throw "bundled weasyprint does not run" }
            $notices.Add("WeasyPrint ($($asset.Name)) - BSD 3-Clause, with LGPL libraries (GTK, Pango, Cairo) - source: https://github.com/Kozea/WeasyPrint")
          }

          Invoke-Bundle "LibreOffice" {
            $listing = (Invoke-WebRequest "https://download.documentfoundation.org/libreoffice/stable/" -UseBasicParsing).Content
            $version = [regex]::Matches($listing, 'href="(\d+\.\d+\.\d+)/"') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } -Descending | Select-Object -First 1
            if (-not $version) { throw "no stable version listed" }
            $msi = Join-Path $work "LibreOffice.msi"
            Invoke-WebRequest "https://download.documentfoundation.org/libreoffice/stable/$version/win/x86_64/LibreOffice_${version}_Win_x86-64.msi" -OutFile $msi
            $admin = Join-Path $work "lo-admin"
            $msiexec = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$admin`"" -PassThru
            if (-not $msiexec.WaitForExit(1200000)) { $msiexec.Kill($true); throw "unpacking the LibreOffice installer took longer than 20 minutes" }
            $soffice = Get-ChildItem $admin -Recurse -Filter "soffice.exe" | Select-Object -First 1
            if (-not $soffice) { throw "soffice.exe not found in the unpacked installer" }
            $dest = Join-Path $tools "soffice"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$($soffice.Directory.Parent.FullName)\*" $dest -Recurse -Force
            if (-not (Test-Path (Join-Path $dest "program/soffice.exe"))) { throw "unexpected LibreOffice layout" }
            $notices.Add("LibreOffice $version - Mozilla Public License 2.0 and others - source: https://www.libreoffice.org/download/source-code/")
          }

          $notices.Insert(0, "Programs bundled under tools/ run as separate processes; each keeps its own licence.")
          $notices.Insert(1, "qpdf - Apache-2.0 - https://github.com/qpdf/qpdf; Tesseract - Apache-2.0 - https://github.com/tesseract-ocr/tesseract")
          $notices | Out-File -Encoding utf8 (Join-Path $tools "THIRD-PARTY.txt")

          $results.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          Get-ChildItem $tools -Directory | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"
          }
          if ($results.Values | Where-Object { $_ -ne "ok" }) { throw "Some programs could not be bundled" }

      # The program must start and answer before it is worth uploading.
      - name: Smoke test the packaged program
        shell: pwsh
        run: |
          $exe = "packaged/Scripta/Scripta.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput smoke.out.log -RedirectStandardError smoke.err.log
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8080/api/v1/info/status" -UseBasicParsing -TimeoutSec 3
              if ($r.Content -match "UP") { $up = $true; break }
            } catch { }
            if ($proc.HasExited) { break }
          }
          Write-Host "--- stdout (tail)"; if (Test-Path smoke.out.log) { Get-Content smoke.out.log -Tail 40 }
          Write-Host "--- stderr (tail)"; if (Test-Path smoke.err.log) { Get-Content smoke.err.log -Tail 40 }
          Get-Process -Name Scripta -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = (Get-Content smoke.out.log, smoke.err.log -ErrorAction SilentlyContinue) -join "`n"
          if ($log -match "Missing dependency: .*tesseract") { throw "The packaged program did not find its bundled Tesseract" }
          foreach ($tool in "qpdf", "gs", "magick", "pdftohtml", "weasyprint", "soffice") {
            if ($log -match "Missing dependency: [^\r\n]*\b$tool") { throw "The packaged program did not find its bundled $tool" }
          }
          if (-not $up) { throw "The packaged program did not report UP on /api/v1/info/status" }
          Write-Host "Packaged program is UP"

      - name: Make the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # 7-Zip: Compress-Archive is slow on a package this size.
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=5 "release/Scripta-$env:APP_VERSION-windows-x64-portable.zip" packaged/Scripta | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }

      - name: Make the installer
        shell: pwsh
        run: |
          # jpackage needs the WiX 3 toolset; the runner image normally has it.
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wix) { $env:PATH = "$($wix.FullName);$env:PATH" } else { choco install wixtoolset -y --no-progress; $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;$env:PATH" }
          }
          jpackage --type exe `
            --name Scripta `
            --app-version $env:APP_VERSION `
            --vendor "Stephen Stirling" `
            --description "Self-hosted PDF tools" `
            --app-image packaged/Scripta `
            --win-per-user-install `
            --win-menu `
            --win-shortcut `
            --dest release
          if ($LASTEXITCODE -ne 0) { throw "jpackage installer failed" }
          # "sha256  file" lines, the format Integra and sha256sum read.
          Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
          Get-ChildItem release | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: scripta-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scripta-windows-x64
          path: release
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Windows
          Download the portable zip (unpack and run `Scripta.exe`) or the per-user installer. Both are self-contained: they include Tesseract for OCR and qpdf, Ghostscript, LibreOffice, WeasyPrint, ImageMagick and Poppler, so most tools work without installing anything else. Your settings and sign-ins are kept in `%LOCALAPPDATA%\Scripta`. `SHA256SUMS.txt` lists the checksums. The installer is not code-signed, so Windows SmartScreen will warn before it runs.

          ## Bundled programs
          They run as separate programs and keep their own licences, listed with source links in `tools\THIRD-PARTY.txt` inside the package. Ghostscript is AGPL-licensed and Poppler is GPL-licensed. Calibre (PDF to EPUB) and the `rar` tool (CBR output) are not included.

          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --notes-file notes.md --generate-notes --title "Scripta $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
