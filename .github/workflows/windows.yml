name: Windows build

# Builds Scripta for Windows on a Windows runner as an ordinary installer, Scripta-<version>-setup-x64.exe
# (installer/Scripta.iss), that Integra (or a person) runs. It installs Scripta.exe, a small window app
# (launcher/Scripta) that starts the Java engine hidden and shows the UI in its own window, beside app/
# (the engine jar), runtime/ (a trimmed Java runtime) and tools/ (bundled programs). Before anything is
# uploaded, the engine must answer on /api/v1/info/status twice: once from the assembled folder and
# once from a silent install, which is then uninstalled. Pushing a v* tag also attaches the installer
# and its checksums to a GitHub release; branch pushes and manual runs only produce artifacts.
#
# Every outside program Scripta calls is bundled under tools/, so one download has every
# feature: Tesseract (OCR, auto-rotate), LibreOffice (Office conversions), Ghostscript and
# qpdf (compress, repair, vector), Poppler (PDF to HTML/Markdown), ImageMagick (compress),
# Calibre (PDF to EPUB), WeasyPrint (HTML, Markdown, URL and email to PDF) and Python with
# OpenCV and OCRmyPDF. BundledTools in app/common maps each command to its folder here; the
# two must stay in sync. Only RAR (licence forbids it) and unoserver (LibreOffice is called
# directly instead) are left out.
on:
  workflow_dispatch:
  push:
    branches: [windows-exe, windows-full-bundle]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPTA_FLAVOR: core
  TASK_VERSION: "3.54.0"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Allow long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          # Zulu ships the jmods that jlink needs to build a trimmed runtime; Temurin 25 does not.
          distribution: zulu
          java-version: "25"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The frontend build is driven through Task, which the Gradle build calls.
      - name: Install Task
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "task.zip"
          $dir = Join-Path $env:RUNNER_TEMP "task"
          Invoke-WebRequest "https://github.com/go-task/task/releases/download/v$env:TASK_VERSION/task_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the jar and the frontend
        shell: pwsh
        run: >
          ./gradlew.bat clean build
          -PbuildWithFrontend=true
          -PjpdfiumPlatforms=windows-x64
          -PbundleOnnxRuntime=true
          -x spotlessApply -x spotlessCheck -x test -x sonarqube
          --no-daemon

      - name: Package the program
        shell: pwsh
        run: |
          $jar = Get-ChildItem app/core/build/libs/*.jar | Where-Object { $_.Name -notmatch 'plain' } | Select-Object -First 1
          if (-not $jar) { throw "No application jar found in app/core/build/libs" }
          $version = (Select-String -Path build.gradle -Pattern "^\s*version = '([\d.]+)'" | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw "Could not read the version from build.gradle" }
          # A release must carry the version its tag names, or Integra would see the wrong version installed.
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in build.gradle"
          }
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path packaged/Scripta/app | Out-Null
          Copy-Item $jar.FullName packaged/Scripta/app/scripta.jar
          # The restart helper must sit beside the main jar (JarPathUtil looks there).
          Copy-Item build/libs/restart-helper.jar packaged/Scripta/app/restart-helper.jar

          # Every runtime module except the JDK's own developer tools. A Spring Boot fat jar
          # hides its dependencies from module detection, and a missing module only shows up as a
          # crash at runtime, so this trims by exclusion rather than by guessing.
          # If jlink fails, the whole JDK is used as the runtime: larger but complete.
          $devTools = "jdk.jshell","jdk.jdeps","jdk.javadoc","jdk.compiler","jdk.jcmd","jdk.jconsole","jdk.jlink","jdk.jpackage","jdk.hotspot.agent","jdk.jartool","jdk.jdi","jdk.editpad"
          $modules = ((java --list-modules) | ForEach-Object { ($_ -split '@')[0] } | Where-Object { $devTools -notcontains $_ }) -join ","
          jlink --module-path "$env:JAVA_HOME/jmods" --add-modules $modules --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output runtime
          if ($LASTEXITCODE -ne 0) {
            Write-Host "jlink failed; using the full JDK as the runtime"
            Remove-Item -Recurse -Force runtime -ErrorAction SilentlyContinue
            Copy-Item $env:JAVA_HOME runtime -Recurse
          }
          Write-Host "Runtime: $([math]::Round((Get-ChildItem runtime -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"
          Move-Item runtime packaged/Scripta/runtime

          # The window app. Self-contained, so the PC needs no .NET; WebView2 ships with Windows 11
          # and current Windows 10.
          dotnet publish launcher/Scripta/Scripta.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o launcher-out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Copy-Item launcher-out/Scripta.exe packaged/Scripta/Scripta.exe
          Write-Host "Scripta.exe: $([math]::Round((Get-Item packaged/Scripta/Scripta.exe).Length / 1MB, 1)) MB"

      # The window app cannot extend PATH, so the engine finds this copy through scripta.tools-path.
      - name: Bundle Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "tesseract.exe not found in $src" }
          $dest = "packaged/Scripta/tools/tesseract"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" $dest -Recurse -Force -Exclude "unins*","*.url"
          $tessdata = Join-Path $dest "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          foreach ($lang in "eng","osd","deu","fra","spa","ita","por","nld") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile (Join-Path $tessdata "$lang.traineddata")
          }
          & "$dest/tesseract.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled tesseract does not run" }
          & "$dest/tesseract.exe" --list-langs
          Write-Host "Bundled Tesseract: $([math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      # Installed with Chocolatey on the runner, then copied into the package, which runs them
      # from there. Each copy is run once from its new place, so a broken copy fails the build.
      - name: Bundle Ghostscript, qpdf, ImageMagick and Calibre
        shell: pwsh
        run: |
          choco install ghostscript qpdf imagemagick.app calibre -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed" }
          $tools = "packaged/Scripta/tools"

          # Finds $exe under $roots (newest first), skipping Chocolatey's shims, and copies the
          # whole install: $levelsUp 1 when the exe sits in a bin folder, 0 when at the top.
          function Copy-Tool($roots, $exe, $levelsUp, $dest) {
            $found = Get-ChildItem $roots -Recurse -Filter $exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\chocolatey\\bin\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $found) { throw "$exe not found after install" }
            $src = $found.Directory
            for ($i = 0; $i -lt $levelsUp; $i++) { $src = $src.Parent }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$($src.FullName)\*" $dest -Recurse -Force -Exclude "unins*","*.url"
            Write-Host "$dest <- $($src.FullName): $([math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"
          }

          Copy-Tool "C:\Program Files\gs" "gswin64c.exe" 1 "$tools/ghostscript"
          & "$tools/ghostscript/bin/gswin64c.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "bundled Ghostscript does not run" }

          Copy-Tool "C:\ProgramData\chocolatey\lib\qpdf", "C:\Program Files\qpdf*" "qpdf.exe" 1 "$tools/qpdf"
          & "$tools/qpdf/bin/qpdf.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled qpdf does not run" }

          Copy-Tool "C:\Program Files\ImageMagick*" "magick.exe" 0 "$tools/imagemagick"
          & "$tools/imagemagick/magick.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "bundled ImageMagick does not run" }

          Copy-Tool "C:\Program Files\Calibre2" "ebook-convert.exe" 0 "$tools/calibre"
          & "$tools/calibre/ebook-convert.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled Calibre does not run" }

      - name: Bundle LibreOffice
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install libreoffice-fresh failed" }
          $dest = "packaged/Scripta/tools/libreoffice"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "C:\Program Files\LibreOffice\*" $dest -Recurse -Force
          Write-Host "LibreOffice: $([math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

          # A real conversion from the bundled copy, with a throwaway profile as Scripta uses.
          $work = Join-Path $env:RUNNER_TEMP "lo-check"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Content -Path "$work/check.rtf" -Value '{\rtf1\ansi Scripta LibreOffice check\par}' -Encoding ascii
          $profile = ([Uri](Join-Path $env:RUNNER_TEMP "lo-profile")).AbsoluteUri
          $p = Start-Process -FilePath "$dest/program/soffice.exe" -Wait -PassThru -NoNewWindow `
            -ArgumentList "-env:UserInstallation=$profile","--headless","--nologo","--convert-to","pdf","--outdir","`"$work`"","`"$work/check.rtf`""
          if (-not (Test-Path "$work/check.pdf")) { throw "bundled LibreOffice did not convert a file (exit $($p.ExitCode))" }
          Write-Host "Bundled LibreOffice converted a file"

      # Poppler and WeasyPrint publish Windows builds on GitHub; the latest release is used.
      - name: Bundle Poppler and WeasyPrint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = "packaged/Scripta/tools"
          $dl = Join-Path $env:RUNNER_TEMP "downloads"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null

          gh release download --repo oschwartz10612/poppler-windows --pattern "Release-*.zip" --dir "$dl/poppler" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Poppler download failed" }
          Expand-Archive (Get-ChildItem "$dl/poppler/*.zip" | Select-Object -First 1).FullName -DestinationPath "$dl/poppler/x" -Force
          $bin = (Get-ChildItem "$dl/poppler/x" -Recurse -Filter pdftohtml.exe | Select-Object -First 1).Directory
          if (-not $bin) { throw "pdftohtml.exe not in the Poppler download" }
          New-Item -ItemType Directory -Force -Path "$tools/poppler/bin" | Out-Null
          Copy-Item "$($bin.FullName)\*" "$tools/poppler/bin" -Recurse -Force
          $share = Join-Path $bin.Parent.FullName "share"
          if (Test-Path $share) { Copy-Item $share "$tools/poppler/share" -Recurse -Force }
          & "$tools/poppler/bin/pdftohtml.exe" -v
          Write-Host "Bundled Poppler"

          $assets = gh release view --repo Kozea/WeasyPrint --json assets --jq '.assets[].name'
          Write-Host "WeasyPrint release files: $($assets -join ', ')"
          $asset = $assets | Where-Object { $_ -match '(?i)win' -and $_ -match '(?i)\.(zip|exe)$' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows build in the latest WeasyPrint release" }
          gh release download --repo Kozea/WeasyPrint --pattern $asset --dir "$dl/weasyprint" --clobber
          if ($LASTEXITCODE -ne 0) { throw "WeasyPrint download failed" }
          New-Item -ItemType Directory -Force -Path "$tools/weasyprint" | Out-Null
          if ($asset -match '(?i)\.zip$') {
            Expand-Archive "$dl/weasyprint/$asset" -DestinationPath "$dl/weasyprint/x" -Force
            $exe = Get-ChildItem "$dl/weasyprint/x" -Recurse -Filter weasyprint.exe | Select-Object -First 1
            if (-not $exe) { throw "weasyprint.exe not in $asset" }
            Copy-Item "$($exe.Directory.FullName)\*" "$tools/weasyprint" -Recurse -Force
          } else {
            Copy-Item "$dl/weasyprint/$asset" "$tools/weasyprint/weasyprint.exe" -Force
          }
          & "$tools/weasyprint/weasyprint.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled WeasyPrint does not run" }

      # The embeddable Python is relocatable; site-packages is switched on so pip can add the
      # packages the scripts in app/core/src/main/resources/static/python and OCRmyPDF need.
      - name: Bundle Python with OpenCV and OCRmyPDF
        shell: pwsh
        env:
          PYTHON_VERSION: "3.12.10"
        run: |
          $dest = "packaged/Scripta/tools/python"
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest -Force
          $pth = Get-ChildItem "$dest/python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' | Set-Content $pth.FullName -Encoding ascii
          Add-Content $pth.FullName "Lib\site-packages" -Encoding ascii
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:RUNNER_TEMP/get-pip.py"
          & "$dest/python.exe" "$env:RUNNER_TEMP/get-pip.py" --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "pip could not be installed" }
          & "$dest/python.exe" -m pip install --no-warn-script-location --disable-pip-version-check opencv-python-headless numpy pillow pdf2image ocrmypdf
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

          # pip's ocrmypdf.exe has this runner's path baked in, so Scripta calls this instead.
          Set-Content -Path "$dest/ocrmypdf.cmd" -Value '@"%~dp0python.exe" -m ocrmypdf %*' -Encoding ascii

          & "$dest/python.exe" -c "import cv2, numpy, PIL, pdf2image, ocrmypdf; print('Python packages OK')"
          if ($LASTEXITCODE -ne 0) { throw "bundled Python packages do not import" }
          & "$dest/ocrmypdf.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "bundled OCRmyPDF does not run" }
          Write-Host "Python: $([math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: Bundled tools and licences
        shell: pwsh
        run: |
          $tools = "packaged/Scripta/tools"
          @"
          Programs bundled with Scripta for Windows. Each is a separate program that Scripta runs; each keeps
          its own licence, found in its folder here. Their source code is available from their projects.

            tesseract    Tesseract OCR          Apache-2.0      https://github.com/tesseract-ocr/tesseract
            libreoffice  LibreOffice            MPL-2.0         https://www.libreoffice.org/download/source-code/
            ghostscript  Ghostscript            AGPL-3.0        https://ghostscript.com/releases/gsdnld.html
            qpdf         qpdf                   Apache-2.0      https://github.com/qpdf/qpdf
            poppler      Poppler                GPL-2.0/3.0     https://poppler.freedesktop.org/
            imagemagick  ImageMagick            ImageMagick     https://imagemagick.org/script/license.php
            calibre      calibre                GPL-3.0         https://github.com/kovidgoyal/calibre
            weasyprint   WeasyPrint             BSD-3-Clause    https://github.com/Kozea/WeasyPrint
            python       Python, OpenCV, NumPy, Pillow, pdf2image, OCRmyPDF and their dependencies
                         (PSF, Apache-2.0, BSD, HPND, MIT, MPL-2.0)  https://pypi.org/
          "@ | Set-Content "$tools/README.txt" -Encoding utf8
          Get-ChildItem $tools -Directory | ForEach-Object {
            Write-Host ("{0,-12} {1,8} MB" -f $_.Name, [math]::Round((Get-ChildItem $_.FullName -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1))
          }

      # The engine must start, the way the window app starts it, and answer before it is worth
      # uploading. The self-test runs the window app's own start-up code without opening a window.
      - name: Smoke test the packaged program
        shell: pwsh
        run: |
          $exe = (Resolve-Path "packaged/Scripta/Scripta.exe").Path
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$result`"" -PassThru
          if (-not $test.WaitForExit(300000)) { $test.Kill($true); Write-Host "The self-test timed out" }
          $outcome = if (Test-Path $result) { (Get-Content $result -Raw).Trim() } else { "no result written" }
          Write-Host "Self-test: $outcome"
          $engineLog = Join-Path $env:LOCALAPPDATA "Scripta\logs\engine.log"
          $log = if (Test-Path $engineLog) { Get-Content $engineLog } else { @() }
          Write-Host "--- engine log (tail)"; $log | Select-Object -Last 60
          # RAR can't be bundled (licence) and unoserver isn't needed (LibreOffice runs directly).
          $missing = $log | Where-Object { $_ -match "Missing dependency" -and $_ -notmatch "(?i)Missing dependency: (rar|unoconvert)\b" }
          if ($missing) { $missing | ForEach-Object { Write-Host "::error::$_" }; throw "The packaged program did not find some bundled tools" }
          if ($outcome -notmatch "^READY") { throw "The engine did not report UP: $outcome" }
          # With nothing running, --quit must succeed at once (Integra calls it before an update).
          $quit = Start-Process -FilePath $exe -ArgumentList "--quit" -PassThru -Wait
          if ($quit.ExitCode -ne 0) { throw "Scripta.exe --quit failed with $($quit.ExitCode)" }
          Write-Host "Packaged program starts and answers"

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" }
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $source = (Resolve-Path "packaged/Scripta").Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$source" installer/Scripta.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem release | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      # Installs the way Integra does, starts the installed copy, then uninstalls and checks it's gone,
      # with the Start menu entry and the Installed apps entry checked on the way.
      - name: Test install and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter "Scripta-*-setup-x64.exe").FullName
          $dir = Join-Path $env:RUNNER_TEMP "Scripta install test"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "Setup failed with $($p.ExitCode)" }
          $exe = Join-Path $dir "Scripta.exe"
          if (-not (Test-Path $exe)) { throw "Scripta.exe was not installed" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "Scripta.lnk"
          if (-not (Test-Path $shortcut)) { throw "No Start menu entry at $shortcut" }
          $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq "Scripta" }
          if (-not $entry) { throw "Scripta is not in Installed apps" }
          if ($entry.DisplayVersion -ne $env:APP_VERSION) { throw "Installed apps shows version $($entry.DisplayVersion)" }
          Write-Host "Installed apps: $($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher)"

          $result = Join-Path $env:RUNNER_TEMP "selftest-installed.txt"
          $test = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$result`"" -PassThru
          if (-not $test.WaitForExit(300000)) { $test.Kill($true) }
          $outcome = if (Test-Path $result) { (Get-Content $result -Raw).Trim() } else { "no result written" }
          Write-Host "Installed self-test: $outcome"
          if ($outcome -notmatch "^READY") { throw "The installed copy did not start: $outcome" }

          # The uninstaller hands over to a copy of itself and returns, so wait for the folder to go.
          $uninstall = $entry.QuietUninstallString
          if (-not $uninstall) { throw "No QuietUninstallString for Integra to use" }
          if ($uninstall -notmatch '^"([^"]+)"\s*(.*)$') { throw "Unexpected QuietUninstallString: $uninstall" }
          Start-Process -FilePath $Matches[1] -ArgumentList $Matches[2], "/SUPPRESSMSGBOXES" -Wait
          $deadline = (Get-Date).AddMinutes(3)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw "Uninstalling left Scripta.exe behind" }
          if (Test-Path $shortcut) { throw "Uninstalling left the Start menu entry behind" }
          Write-Host "Install, start and uninstall all work"

      - name: Write checksums
        shell: pwsh
        run: |
          # "sha256  file" lines, the format Integra and sha256sum read.
          Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
          Get-ChildItem release | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: scripta-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scripta-windows-x64
          path: release
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Windows
          Scripta installs like any other Windows app: run `Scripta-<version>-setup-x64.exe`. It goes in the Start menu and in Settings > Apps > Installed apps, where it can be uninstalled. The easiest way to install and update it is [Integra](https://github.com/stephenstirling/integra), which runs the same installer quietly. It is self-contained: every program Scripta calls is bundled, so all tools work without installing anything else. Your settings and sign-ins are kept in `%LOCALAPPDATA%\Scripta` and survive updates and uninstalling. `SHA256SUMS.txt` lists the checksums. The installer is not code-signed, so Windows SmartScreen may warn when it's downloaded with a browser; installs through Integra don't get that warning.

          ## Bundled programs
          They run as separate programs and keep their own licences, listed with source links in `tools\README.txt` inside the package. Ghostscript is AGPL-licensed, and Poppler and Calibre are GPL-licensed. RAR (PDF to CBR) is not included because its licence forbids it.

          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* --notes-file notes.md --generate-notes --title "Scripta $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
