name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test (core)
        run: ./gradlew build -PnoSpotless --no-daemon --continue 2>&1 | tee gradle.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          set +e
          summarize() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=Gradle errors::$(grep -nE 'error:|FAILED|What went wrong|Could not|Exception' gradle.log | head -60 | summarize)"
          echo "::error title=Gradle tail::$(tail -80 gradle.log | summarize)"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines = []
          for f in glob.glob("app/**/build/test-results/test/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or (bad.text or "")[:300]).replace("\n", " ")[:300]
                      lines.append(f"{case.get('classname')}.{case.get('name')}: {msg}")
          if lines:
              print("::error title=Failing tests::" + "%0A".join(lines[:60]).replace("\r", ""))
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx editor/scripts/setup-env.mts --core
      - run: npx tsc --noEmit --project editor/src/core/tsconfig.json
      - run: npx oxlint --config oxlint.config.ts --max-warnings=0
      - run: npx vitest run --root editor --project core
      - run: npx vite build editor --mode core
