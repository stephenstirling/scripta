name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (core)
        run: ./gradlew build -PnoSpotless --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx editor/scripts/setup-env.mts --core
      - run: npx tsc --noEmit --project editor/src/core/tsconfig.json
      - run: npx oxlint --config oxlint.config.ts --max-warnings=0
      - run: npx vitest run --root editor --project core
      - run: npx vite build editor --mode core
