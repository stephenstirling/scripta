name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test (core)
        run: ./gradlew build -PnoSpotless --no-daemon --continue 2>&1 | tee gradle.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error: |\.java:[0-9]+: error" gradle.log | head -40 | while read -r line; do echo "::error::${line}"; done
          grep -E "FAILED$|What went wrong" -A2 gradle.log | head -60 | while read -r line; do echo "::error::${line}"; done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob("app/**/build/test-results/test/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or bad.text or "").replace("\n", " ")[:300]
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
                      n += 1
                      if n >= 40:
                          raise SystemExit
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx editor/scripts/setup-env.mts --core
      - run: npx tsc --noEmit --project editor/src/core/tsconfig.json
      - run: npx oxlint --config oxlint.config.ts --max-warnings=0
      - run: npx vitest run --root editor --project core
      - run: npx vite build editor --mode core
