services:
  scripta:
    container_name: Scripta-Ultra-Lite
    image: ghcr.io/stephenstirling/scripta:ultra-lite
    build:
      context: ../../../
      dockerfile: docker/embedded/Dockerfile.ultra-lite
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP' && curl -fL http://localhost:8080/ | grep -qv 'Please sign in'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../../scripta/latest/config:/configs:rw
      - ../../../scripta/latest/logs:/logs:rw
    environment:
      SECURITY_ENABLELOGIN: "false"
      # JAVA_BASE_OPTS: ""               # Full JVM flag override (default comes from the image _JVM_OPTS)
      # JAVA_CUSTOM_OPTS: ""              # Additional JVM flags appended to the active options
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Scripta-Ultra-lite
      UI_HOMEDESCRIPTION: Demo site for Scripta-Ultra-lite Latest
      UI_APPNAMENAVBAR: Scripta-Ultra-lite Latest
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    restart: unless-stopped
